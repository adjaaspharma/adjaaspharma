<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Admin | ADJAAS Pharma</title><link rel="stylesheet" href="style.css"><style>
.admin{max-width:1100px;margin:auto;padding:48px 5% 80px}.card{background:#fff;border:1px solid #e1e9ec;border-radius:14px;padding:26px;margin:20px 0;box-shadow:0 10px 35px #173d6809}.hidden{display:none!important}.login{max-width:440px;margin:70px auto}.form{display:grid;grid-template-columns:1fr 1fr;gap:15px 20px}.form label{font-size:13px}.form input:not([type=checkbox]),.form select,.form textarea,.login input{display:block;width:100%;box-sizing:border-box;padding:12px;border:1px solid #d7e1e6;border-radius:8px;margin-top:7px;font:inherit}.form textarea{min-height:95px}.full{grid-column:1/-1}.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.items{display:grid;gap:12px}.item{display:grid;grid-template-columns:72px 1fr auto;align-items:center;gap:14px;border:1px solid #e1e9ec;padding:12px;border-radius:10px}.item img{width:72px;height:72px;object-fit:contain}.muted{font-size:12px;color:#637b8d}.status{font-size:13px;color:#0e989b}.secondary{background:#edf3f5!important;color:#183e66!important}.danger{background:#fff0ee!important;color:#9d2c25!important}@media(max-width:650px){.form{grid-template-columns:1fr}.full{grid-column:auto}.item{grid-template-columns:55px 1fr}.item img{width:55px;height:55px}.item .row{grid-column:1/-1}}
</style></head><body><div class="admin"><p><a href="/">← Back to ADJAAS Pharma website</a></p><section id="login" class="card login"><p class="eyebrow">PRIVATE ACCESS</p><h1>Admin login</h1><p>Sign in to manage products.</p><form id="loginForm"><label>Password<input name="password" type="password" required autocomplete="current-password"></label><div class="row"><button class="button" type="submit">Open dashboard →</button></div><p id="loginStatus" class="status" role="status"></p></form></section>
<section id="dashboard" class="hidden"><div class="row" style="justify-content:space-between;align-items:center"><div><p class="eyebrow">CATALOGUE MANAGEMENT</p><h1>Product dashboard</h1><p>Published products appear on the website under their category.</p></div><button id="logout" class="button secondary">Log out</button></div>
<div class="card"><h2 id="formTitle">Add product</h2><form id="productForm" class="form"><input type="hidden" name="id"><label>Product name *<input name="name" required maxlength="180"></label><label>Category *<select name="category" required><option value="">Choose category</option><option>Tablets</option><option>Capsules</option><option>Syrups</option><option>Injections</option><option>Ointments &amp; Creams</option><option>Dry Syrups</option><option>Nutraceuticals</option></select></label><label class="full">Product photo *<input id="photo" type="file" accept="image/jpeg,image/png,image/webp"><span class="muted">JPG, PNG or WebP; max 2.8 MB.</span><img id="preview" class="hidden" alt="Product preview" style="display:block;max-width:150px;max-height:150px;margin-top:10px"></label><label class="full">Description *<textarea name="description" required></textarea></label><label class="full">Composition / ingredients<input name="composition"></label><label class="full">Uses / product information<textarea name="uses"></textarea></label><label>Pack size<input name="pack_size" placeholder="e.g. 10 tablets / 100 ml"></label><label>MRP / price<input name="mrp" placeholder="Optional"></label><label class="full">Manufacturer / brand<input name="manufacturer"></label><label><input name="is_published" type="checkbox" checked> Publish on website</label><div class="full row"><button class="button" id="save" type="submit">Save product ↗</button><button class="button secondary" id="clear" type="button">Clear form</button></div><p id="formStatus" class="status full" role="status"></p></form></div>
<div class="card"><h2>Products</h2><div id="products" class="items">Loading…</div></div></section></div><script src="admin.js"></script></body></html>
